name: Sync Wiki

on:
  push:
    branches: [main]
    paths: ['.github/wiki/**', 'docs/wiki/**']
  workflow_dispatch:

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync wiki pages
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: .github/wiki/
          token: ${{ secrets.GITHUB_TOKEN }}

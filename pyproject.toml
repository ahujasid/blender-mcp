[project]
name = "blender-mcp"
version = "1.8.7"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["src/blender_mcp/bundled"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
packages = [{ include = "blender_mcp", from = "src" }]

[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.5"
pytest = ">=8.0"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py"]

[project.urls]
"Homepage" = "https://github.com/ahujasid/blender-mcp"
"Bug Tracker" = "https://github.com/ahujasid/blender-mcp/issues"

[project]
name = "blender-mcp"
version = "1.9.0"
description = "Blender MCP integration with transparent 3D stress simulation"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
    "numpy>=1.26,<3",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py"]

[project.urls]
"Homepage" = "https://github.com/waterfirst/blender-mcp"
"Bug Tracker" = "https://github.com/waterfirst/blender-mcp/issues"

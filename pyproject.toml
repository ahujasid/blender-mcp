[project]
name = "blender-mcp"
version = "1.9.2"
description = "Blender integration through the Model Context Protocol"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MCPBlender", email = "owner@blendermcp.org"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp[cli]>=1.3.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
blender-mcp = "blender_mcp.server:main"

# hatchling avoids setuptools egg_base path bugs on Windows Claude Desktop extensions (#283)
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blender_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/blender_mcp",
    "addon.py",
    "README.md",
    "SECURITY.md",
    "LICENSE",
]

[project.urls]
"Homepage" = "https://github.com/MCPBlender/blender-mcp"
"Bug Tracker" = "https://github.com/MCPBlender/blender-mcp/issues"
